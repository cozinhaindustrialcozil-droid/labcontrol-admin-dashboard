<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Calendário | LabControl</title>
  </head>
  <body
    x-data="{ page: 'calendario', loaded: true, darkMode: false, stickyMenu: false, sidebarToggle: true, scrollTop: false }"
    x-init="darkMode = JSON.parse(localStorage.getItem('darkMode')); $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <include src="./partials/preloader.html"></include>
    <div class="flex h-screen overflow-hidden">
      <include src="./partials/sidebar.html"></include>
      <div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">
        <include src="./partials/overlay.html" />
        <include src="./partials/header.html" />
        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
            <div class="mb-6">
              <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Calendário de Devolutivas</h1>
              <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Prazos e previsões de entrega das solicitações</p>
            </div>

            <div class="grid grid-cols-12 gap-4 md:gap-6">
              <div class="col-span-12 xl:col-span-8 rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
                <div id="calendar-lab" class="min-h-[500px]"></div>
              </div>
              <div class="col-span-12 xl:col-span-4">
                <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] mb-4">
                  <h3 class="text-base font-semibold text-gray-800 dark:text-white mb-4">Legenda</h3>
                  <div class="space-y-2">
                    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-orange-500"></span><span class="text-sm text-gray-600 dark:text-gray-400">Urgente</span></div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-red-500"></span><span class="text-sm text-gray-600 dark:text-gray-400">Alta Prioridade</span></div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-500"></span><span class="text-sm text-gray-600 dark:text-gray-400">Média Prioridade</span></div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-green-500"></span><span class="text-sm text-gray-600 dark:text-gray-400">Baixa Prioridade</span></div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-gray-400"></span><span class="text-sm text-gray-600 dark:text-gray-400">Finalizada / Cancelada</span></div>
                  </div>
                </div>
                <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
                  <h3 class="text-base font-semibold text-gray-800 dark:text-white mb-3">Próximas Devolutivas</h3>
                  <div id="proximas-devolutivas" class="space-y-2">
                    <p class="text-sm text-gray-400">Carregando...</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
